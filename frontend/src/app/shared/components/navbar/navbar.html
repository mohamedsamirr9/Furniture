<nav class="customer-container navbar navbar-expand-lg">
  <a class="navbar-brand logo" routerLink="/">
    <span class="logo-icon">F</span>
    <!-- {{ 'NAV.BRAND' | translate }} -->
  </a>

  <button
    class="navbar-toggler"
    type="button"
    data-bs-toggle="collapse"
    data-bs-target="#navbarNavAltMarkup"
    [attr.aria-label]="'NAV.TOGGLE_LANG' | translate"
  >
    <span class="navbar-toggler-icon"></span>
  </button>

  <div class="links collapse navbar-collapse" id="navbarNavAltMarkup">
    <div class="navbar-nav w-100 d-flex justify-content-center gap-4 text-center flex-grow-1">
     <a class="nav-item nav-link" routerLink="/">
  {{ 'NAV.HOME' | translate }}
</a>
<a class="nav-item nav-link" routerLink="/products">
  {{ 'NAV.CATALOG' | translate }}
</a>
<a class="nav-item nav-link" routerLink="/about">
  {{ 'NAV.ABOUT_US' | translate }}
</a>
<a class="nav-item nav-link" routerLink="/custom-product">
  {{ 'NAV.CUSTOM_PRODUCT' | translate }}
</a>
    </div>

    <div class="nav-icons d-flex align-items-center gap-3">
     
     

     
      <a class="nav-icon-link position-relative" routerLink="/wishlist" [attr.aria-label]="'NAV.WISHLIST' | translate">
        <i class="bi bi-heart fs-5"></i>
        <span class="badge-dot" *ngIf="(wishlistService.wishlistCount$ | async) || 0 > 0">
          {{ wishlistService.wishlistCount$ | async }}
        </span>
        <span class="badge-dot" *ngIf="(wishlistService.wishlistCount$ | async) === 0">0</span>
      </a>

      
      <a class="nav-icon-link position-relative" routerLink="/cart" [attr.aria-label]="'NAV.CART' | translate">
        <i class="bi bi-bag fs-5"></i>
        <span class="badge-dot" *ngIf="(cartService.cartCount$ | async) || 0 > 0">
          {{ cartService.cartCount$ | async }}
        </span>
        <span class="badge-dot" *ngIf="(cartService.cartCount$ | async) === 0">0</span>
      </a>

      
      <a class="nav-icon-link lang-toggle" style="cursor:pointer" (click)="toggleLanguage()" [attr.aria-label]="'NAV.TOGGLE_LANG' | translate">
        <span class="fs-6 fw-semibold">{{ currentLang === 'en' ? 'AR' : 'EN' }}</span>
      </a>

    
      <ng-container *ngIf="authService.currentUser$ | async as user; else guest">
        <a class="nav-icon-link" routerLink="/customer/profile">
          <i class="bi bi-person fs-5"></i>
        </a>
      </ng-container>
      <ng-template #guest>
        <a class="nav-icon-link" routerLink="/login">
          <i class="bi bi-person fs-5"></i>
        </a>
      </ng-template>

      @if (authService.isLoggedIn()) {
        <app-chat-widget></app-chat-widget>
      }
    </div>
  </div>
</nav>
