<div class="page-header">
  <h1>Orders</h1>
</div>
<hr class="divider" />

<div *ngIf="isLoading">Loading orders...</div>
<div class="table-card" *ngIf="!isLoading">
  <h2 class="card-title">Orders</h2>
  <table class="table">
    <thead>
      <tr>
        <th>Order</th>
        <th>Customer</th>
        <th>Items</th>
        <th>Shipping</th>
        <th>Status</th>
        <th>Total</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let order of (orders.orders || orders)">
        <td><strong>ORD-{{ order.id || order.orderId }}</strong></td>
        <td>{{ order.userName || 'Customer' }}</td>
        <td>{{ order.itemsCount || order.orderItems?.length || 0 }} items</td>
        <td>{{ order.shippingAddress || 'N/A' }}</td>
        <td>
          <select 
            class="badge" 
            [ngClass]="{
              'badge-outline': !isTerminalStatus(order.status),
              'badge-red': order.status === 'Cancelled' || order.status === 'Declined',
              'badge-green': order.status === 'Completed'
            }"
            [disabled]="isTerminalStatus(order.status)"
            (change)="updateStatus(order, $event)">
            <option [value]="order.status" selected>{{ order.status }}</option>
            <option *ngFor="let next of getValidTransitions(order.status)" [value]="next">{{ next }}</option>
          </select>
        </td>
        <td><strong>{{ (order.totalPrice || order.total) | currency }}</strong></td>
      </tr>
    </tbody>
  </table>
</div>
