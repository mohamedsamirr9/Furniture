<div class="page-header">
  <h1>My Profile</h1>
  <p class="page-subtitle">Same view shoppers see — update your photo and details anytime.</p>
</div>
<hr class="divider" />

<div *ngIf="successFlash" class="alert alert-success">Profile updated successfully.</div>
<div *ngIf="loadError" class="alert alert-danger">{{ loadError }}</div>

<app-seller-profile-display
  [seller]="seller"
  [loading]="isLoading"
  [error]="''"
  [editMode]="true"
  [showRequestCustomCta]="false"
  (profileUpdated)="onProfileUpdated($event)"
/>
