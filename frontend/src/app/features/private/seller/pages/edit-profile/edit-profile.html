<div class="page-header">
  <h1>{{ 'SELLER_PROFILE.TITLE' | translate }}</h1>
  <p class="page-subtitle">{{ 'SELLER_PROFILE.SUBTITLE' | translate }}</p>
</div>
<hr class="divider" />

<div *ngIf="successFlash" class="alert alert-success">{{ 'SELLER_PROFILE.SUCCESS_UPDATE' | translate }}</div>
<div *ngIf="loadError" class="alert alert-danger">{{ loadError }}</div>

<app-seller-profile-display
  [seller]="seller"
  [loading]="isLoading"
  [error]="''"
  [editMode]="true"
  [showRequestCustomCta]="false"
  (profileUpdated)="onProfileUpdated($event)"
/>
