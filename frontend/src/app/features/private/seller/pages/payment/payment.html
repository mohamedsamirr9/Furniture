<div class="page-header">
  <h1>Payment</h1>
</div>
<hr class="divider" />

<div class="table-card">
  <h2 class="card-title">Payments</h2>
  <table class="table">
    <thead>
      <tr>
        <th>Payment ID</th>
        <th>Order</th>
        <th>Reference</th>
        <th>Status</th>
        <th>Date</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let payment of payments">
        <td><strong>{{ payment.id }}</strong></td>
        <td>{{ payment.order }}</td>
        <td>{{ payment.reference }}</td>
        <td>
          <span class="badge" [ngClass]="payment.status === 'Refunded' ? 'badge-red' : 'badge-outline'">
            {{ payment.status }}
          </span>
        </td>
        <td><strong>{{ payment.date }}</strong></td>
      </tr>
    </tbody>
  </table>
</div>
