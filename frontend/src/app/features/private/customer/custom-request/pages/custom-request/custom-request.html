<div class="page">
  <h1>Custom Request</h1>
  <div class="form-container">
    <h2>Create Custom Furniture Request</h2>
    <div class="form-row">
      <div class="form-group">
        <label>Title</label>
        <input type="text" placeholder="e.g. salon" />
      </div>
      <div class="form-group">
        <label>Budget Range</label>
        <input type="text" placeholder="$500-$1000" />
      </div>
    </div>
    <div class="form-group">
      <label>Description</label>
      <textarea placeholder="Describe your ideal furniture"></textarea>
    </div>
    <button class="submit-btn">Submit Request</button>
  </div>
</div>
