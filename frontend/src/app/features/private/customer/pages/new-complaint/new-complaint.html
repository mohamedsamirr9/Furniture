<div class="new-complaint-page">
  <h1 class="page-title">{{ 'CUSTOMER.COMPLAINTS.TITLE' | translate }}</h1>
  <p class="page-subtitle">{{ 'CUSTOMER.COMPLAINTS.SUBTITLE' | translate }}</p>

  <div class="form-card">
    <h2 class="form-title">{{ 'CUSTOMER.COMPLAINTS.SUBMIT_TITLE' | translate }}</h2>

    <div class="form-group">
      <label>{{ 'CUSTOMER.COMPLAINTS.ORDER_LABEL' | translate }}</label>
      <div class="select-wrapper">
        <select [(ngModel)]="formData.order" name="order">
          <option value="" disabled selected>{{ 'CUSTOMER.COMPLAINTS.SELECT_ORDER' | translate }}</option>
          <option value="ORD-1234">ORD-1234</option>
          <option value="ORD-1235">ORD-1235</option>
        </select>
      </div>
    </div>

    <div class="form-group">
      <label>{{ 'CUSTOMER.COMPLAINTS.DESC_LABEL' | translate }}</label>
      <textarea
        [(ngModel)]="formData.description"
        name="description"
        placeholder="{{ 'FORMS.MESSAGE' | translate }}"
        rows="6"
      ></textarea>
    </div>

    <div class="submit-wrapper">
      <button class="submit-btn" (click)="onSubmit()">{{ 'SELLER.SUBMIT' | translate }}</button>
    </div>
  </div>
</div>
