<div class="new-complaint-page">
  <h1 class="page-title">{{ 'CUSTOMER.COMPLAINTS.TITLE' | translate }}</h1>
  <p class="page-subtitle">{{ 'CUSTOMER.COMPLAINTS.SUBTITLE' | translate }}</p>

  <div class="form-card">
    <h2 class="form-title">{{ 'CUSTOMER.COMPLAINTS.SUBMIT_TITLE' | translate }}</h2>

    <div class="form-group">
      <label>{{ 'CUSTOMER.COMPLAINTS.ORDER_LABEL' | translate }}</label>
      <div class="select-wrapper">
        <select [(ngModel)]="formData.orderId" name="order">
          <option value="" disabled selected>{{ 'CUSTOMER.COMPLAINTS.SELECT_ORDER' | translate }}</option>
          <option *ngFor="let order of orders" [value]="order.id">ORD-{{ order.id }}</option>
        </select>
      </div>
    </div>

    <div class="form-group">
      <label>{{ 'CUSTOMER.COMPLAINTS.DESC_LABEL' | translate }}</label>
      <textarea
        [(ngModel)]="formData.description"
        name="description"
        placeholder="{{ 'FORMS.MESSAGE' | translate }}"
        rows="6"
      ></textarea>
    </div>

    <div class="form-group">
      <label>Attachment (optional)</label>
      <input type="file" accept="image/*" (change)="onImageSelected($event)" />
      <div class="image-preview" *ngIf="imagePreviewUrl">
        <img [src]="imagePreviewUrl" alt="Complaint attachment preview" />
        <button type="button" class="clear-image-btn" (click)="clearImage()">Remove</button>
      </div>
    </div>

    <p class="upload-status" *ngIf="uploadingImage">Uploading image...</p>
    <p class="error-text" *ngIf="error">{{ error }}</p>

    <div class="submit-wrapper">
      <button class="submit-btn" [disabled]="submitting || uploadingImage" (click)="onSubmit()">
        {{ 'SELLER.SUBMIT' | translate }}
      </button>
    </div>
  </div>
</div>
