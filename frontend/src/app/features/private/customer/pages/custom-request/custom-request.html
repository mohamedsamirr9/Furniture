<div class="custom-page">

  <div class="form-section">
    <h1 class="page-title">Custom Furniture Request</h1>
    <p class="page-subtitle">
      Can't find exactly what you need? Describe your dream piece and we'll connect you with skilled artisans.
    </p>

    <div class="form-row">
      <div class="form-group">
        <label>Full Name</label>
        <input type="text" [(ngModel)]="formData.fullName" name="fullName" />
      </div>
      <div class="form-group">
        <label>Email</label>
        <input type="email" [(ngModel)]="formData.email" name="email" />
      </div>
    </div>

    <div class="form-group">
      <label>Furniture Type</label>
      <div class="select-wrapper">
        <select [(ngModel)]="formData.furnitureType" name="furnitureType">
          <option value="" disabled selected>select type...</option>
          <option value="chair">Chair</option>
          <option value="table">Table</option>
          <option value="sofa">Sofa</option>
          <option value="bed">Bed</option>
          <option value="bookshelf">Bookshelf</option>
        </select>
      </div>
    </div>

    <div class="form-row">
      <div class="form-group">
        <label>Desired Dimensions</label>
        <input type="text" [(ngModel)]="formData.dimensions" name="dimensions" />
      </div>
      <div class="form-group">
        <label>Preferred Material</label>
        <input type="text" [(ngModel)]="formData.material" name="material" />
      </div>
    </div>

    <div class="form-group">
      <label>Budget Range</label>
      <div class="select-wrapper">
        <select [(ngModel)]="formData.budgetRange" name="budgetRange">
          <option value="" disabled selected>select budget...</option>
          <option value="under500">Under $500</option>
          <option value="500-1000">$500 - $1,000</option>
          <option value="1000-2500">$1,000 - $2,500</option>
          <option value="2500-5000">$2,500 - $5,000</option>
          <option value="above5000">Above $5,000</option>
        </select>
      </div>
    </div>

    <div class="form-group">
      <label>Description & Special Requirements</label>
      <textarea [(ngModel)]="formData.description" name="description" rows="5"></textarea>
    </div>

    <div class="upload-area">
      <svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 24 24"
        fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
        <polyline points="17 8 12 3 7 8"/>
        <line x1="12" y1="3" x2="12" y2="15"/>
      </svg>
      <p class="upload-text">Drag & drop reference images or click to upload</p>
      <p class="upload-hint">PNG, JPG up to 10MB</p>
    </div>

    <button class="submit-btn" (click)="onSubmit()">Submit Request</button>
  </div>

  <div class="requests-section">
    <h2 class="section-title">My Requests</h2>
    <div class="request-card" *ngFor="let request of myRequests">
      <div class="request-info">
        <div class="request-name">
          {{ request.name }}
          <span class="badge" [ngClass]="request.status === 'Open' ? 'badge-open' : 'badge-progress'">
            {{ request.status }}
          </span>
        </div>
        <p class="request-desc">{{ request.description }}</p>
      </div>
      <button *ngIf="request.status === 'Open'" class="view-offer-btn" (click)="viewOffer(request.id)">
        View Offer
      </button>
    </div>
  </div>

</div>
