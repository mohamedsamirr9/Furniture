<div class="success-page">
  <div class="success-icon">
    <svg xmlns="http://www.w3.org/2000/svg" width="36" height="36" viewBox="0 0 24 24"
      fill="none" stroke="#7A5C38" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
      <polyline points="20 6 9 17 4 12"/>
    </svg>
  </div>
  <h1 class="success-title">{{ 'CUSTOMER.REQUEST.SUBMITTED_TITLE' | translate }}</h1>
  <p class="success-desc">
    {{ 'ORDER_CONFIRMATION.MESSAGE' | translate }}
  </p>
  <button class="submit-another" (click)="submitAnother()">{{ 'CUSTOMER.REQUEST.SUBMIT_ANOTHER' | translate }}</button>
</div>
