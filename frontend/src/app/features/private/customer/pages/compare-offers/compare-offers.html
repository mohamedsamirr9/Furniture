<div class="compare-page">

  <button class="back-link" (click)="goBack()">
    <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24"
      fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <line x1="19" y1="12" x2="5" y2="12"/>
      <polyline points="12 19 5 12 12 5"/>
    </svg>
    Back to request
  </button>

  <h1 class="page-title">Compare Seller Offers</h1>
  <p class="page-for">For: Dining Table</p>

  <div class="offers-grid">
    <div class="offer-card" *ngFor="let offer of offers">
      <h3 class="offer-name">{{ offer.name }}</h3>
      <div class="offer-rows">
        <div class="offer-row">
          <span>Price</span>
          <span>{{ offer.price }}</span>
        </div>
        <div class="offer-row">
          <span>Delivery</span>
          <span>{{ offer.delivery }}</span>
        </div>
        <div class="offer-row">
          <span>Material</span>
          <span class="bold">{{ offer.material }}</span>
        </div>
        <div class="offer-row">
          <span>Rating</span>
          <span class="rating">
            <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="#3d6b4f" stroke="none">
              <polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/>
            </svg>
            {{ offer.rating }}
          </span>
        </div>
      </div>
      <button class="accept-btn" (click)="acceptOffer(offer)">Accept Offer</button>
    </div>
  </div>

</div>
