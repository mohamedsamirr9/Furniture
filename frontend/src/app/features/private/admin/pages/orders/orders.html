<div class="page-header">
  <h1>Orders</h1>
  <hr />
</div>

<div class="table-card">
  <h2 class="card-title">All Orders</h2>
  <table class="table">
    <thead>
      <tr>
        <th>Order</th>
        <th>Customer</th>
        <th>Seller</th>
        <th>Total</th>
        <th>Status</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let order of orders">
        <td>{{ order.id }}</td>
        <td>{{ order.customer }}</td>
        <td>{{ order.seller }}</td>
        <td><strong>{{ order.total }}</strong></td>
        <td><span class="badge-outline">{{ order.status }}</span></td>
      </tr>
    </tbody>
  </table>
</div>
