<div class="page-header">
  <h1>Categories</h1>
  <button class="add-btn" (click)="openAddModal()">+ Add Category</button>
</div>
<hr class="divider" />

<!-- Loading -->
<div *ngIf="isLoading" class="loading-text">Loading categories...</div>

<!-- Category Grid -->
<div class="categories-grid" *ngIf="!isLoading">
  <div class="category-card" *ngFor="let cat of categories.items || categories">
    <img class="category-img" *ngIf="cat.image" [src]="cat.image" [alt]="cat.name" />
    <div class="category-info">
      <div class="category-row">
        <strong>{{ cat.name }}</strong>
        <div class="actions">
          <span class="edit-btn" (click)="openEditModal(cat)">🖊</span>
          <span class="delete-btn" (click)="deleteCategory(cat.id)">🗑</span>
        </div>
      </div>
      <p class="category-desc">{{ cat.description }}</p>
    </div>
  </div>
</div>

<!-- Modal Overlay -->
<div class="modal-overlay" *ngIf="showModal" (click)="closeModal()">
  <div class="modal-content" (click)="$event.stopPropagation()">
    <div class="modal-header">
      <h2>{{ isEditing ? 'Edit Category' : 'Add Category' }}</h2>
      <span class="modal-close" (click)="closeModal()">&times;</span>
    </div>

    <!-- Success / Error Messages -->
    <div class="alert alert-success" *ngIf="successMessage">{{ successMessage }}</div>
    <div class="alert alert-error" *ngIf="errorMessage">{{ errorMessage }}</div>

    <form [formGroup]="categoryForm" (ngSubmit)="onSubmit()">
      <div class="form-row" style="display: flex; gap: 15px; margin-bottom: 15px;">
        <div class="form-group" style="flex: 1;">
          <label for="nameEn">English Name *</label>
          <input id="nameEn" type="text" formControlName="nameEn" placeholder="Category name in English" />
          <small class="error-text" *ngIf="categoryForm.get('nameEn')?.touched && categoryForm.get('nameEn')?.invalid">
            English Name is required.
          </small>
        </div>
        <div class="form-group" style="flex: 1;">
          <label for="nameAr">Arabic Name</label>
          <input id="nameAr" type="text" formControlName="nameAr" placeholder="اسم الفئة بالعربية" dir="rtl" />
        </div>
      </div>

      <div class="form-row" style="display: flex; gap: 15px; margin-bottom: 15px;">
        <div class="form-group" style="flex: 1;">
          <label for="descriptionEn">English Description *</label>
          <textarea id="descriptionEn" formControlName="descriptionEn" rows="3" placeholder="Category description in English"></textarea>
          <small class="error-text" *ngIf="categoryForm.get('descriptionEn')?.touched && categoryForm.get('descriptionEn')?.invalid">
            English Description is required.
          </small>
        </div>
        <div class="form-group" style="flex: 1;">
          <label for="descriptionAr">Arabic Description</label>
          <textarea id="descriptionAr" formControlName="descriptionAr" rows="3" placeholder="وصف الفئة بالعربية" dir="rtl"></textarea>
        </div>
      </div>

      <div class="form-group">
        <label>Category Image</label>
        <input type="file" (change)="onImageSelected($event)" />

        <div *ngIf="isUploading">Uploading image...</div>
      </div>
      <img
        *ngIf="!isUploading && categoryForm.get('image')?.value"
        [src]="categoryForm.get('image')?.value"
        width="120"
      />

      <div class="form-actions">
        <button type="button" class="btn-cancel" (click)="closeModal()">Cancel</button>
        <button type="submit" class="btn-submit" [disabled]="isSubmitting || isUploading">
          {{ isSubmitting ? 'Saving...' : isEditing ? 'Update Category' : 'Add Category' }}
        </button>
      </div>
    </form>
  </div>
</div>
