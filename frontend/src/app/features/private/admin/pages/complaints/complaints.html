<div class="page-header">
  <h1>Complaints</h1>
  <hr />
</div>

<div class="table-card">
  <h2 class="card-title">All Complaints</h2>
  <table class="table">
    <thead>
      <tr>
        <th>ID</th>
        <th>User</th>
        <th>Description</th>
        <th>Date</th>
        <th>Status</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let complaint of complaints">
        <td>{{ complaint.id }}</td>
        <td>{{ complaint.user }}</td>
        <td>{{ complaint.description }}</td>
        <td>{{ complaint.date }}</td>
        <td>
          <span class="badge"
            [ngClass]="{
              'badge-red': complaint.status === 'Open',
              'badge-outline': complaint.status === 'In Progress',
              'badge-gray': complaint.status === 'Resolved'
            }">
            {{ complaint.status }}
          </span>
        </td>
      </tr>
    </tbody>
  </table>
</div>
