<div class="page-header">
  <h1>Users</h1>
  <hr />
</div>

<div class="table-card">
  <h2 class="card-title">Users Management</h2>
  <table class="table">
    <thead>
      <tr>
        <th>Name</th>
        <th>Email</th>
        <th>Phone</th>
        <th>Address</th>
        <th>Status</th>
        <th>Joined</th>
        <th>Status</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let user of users">
        <td><strong>{{ user.name }}</strong></td>
        <td>{{ user.email }}</td>
        <td>{{ user.phone }}</td>
        <td>{{ user.address }}</td>
        <td><span class="badge-outline">{{ user.role }}</span></td>
        <td>{{ user.joined }}</td>
        <td>
          <span class="badge"
            [ngClass]="user.accountStatus === 'Deleted' ? 'badge-red' : 'badge-gray'">
            {{ user.accountStatus }}
          </span>
        </td>
      </tr>
    </tbody>
  </table>
</div>
