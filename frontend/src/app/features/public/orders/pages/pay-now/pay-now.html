<div class="container py-4">
  <div class="row justify-content-center">
    <div class="col-lg-10">
      <div class="d-flex align-items-center justify-content-between mb-3">
        <h2 class="h4 m-0">Complete payment</h2>
        <button class="btn btn-outline-dark" (click)="goToOrders()">My orders</button>
      </div>

      <div
        *ngIf="errorMessage"
        class="alert alert-danger d-flex align-items-center justify-content-between shadow-sm mb-3"
      >
        <div>
          <i class="bi bi-exclamation-triangle-fill me-2"></i>
          <strong>Payment Issue:</strong> {{ errorMessage }}
        </div>
        <button *ngIf="!isLoading" class="btn btn-sm btn-danger" (click)="startPaymentFlow()">
          Try Again
        </button>
      </div>

      <div *ngIf="isLoading" class="alert alert-info">Preparing payment...</div>

      <div *ngIf="!isLoading && safePaymentUrl" class="card border-0 shadow-sm">
        <div class="card-body p-0">
          <iframe
            title="Payment"
            [src]="safePaymentUrl"
            style="width: 100%; height: 75vh; border: 0"
            referrerpolicy="no-referrer"
            allow="payment *"
          ></iframe>
        </div>
      </div>
    </div>
  </div>
</div>
