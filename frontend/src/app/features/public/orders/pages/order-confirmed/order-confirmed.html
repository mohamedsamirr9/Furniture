<div class="container text-center py-5 mt-5">
  <div class="row justify-content-center">
    <div class="col-md-6 col-lg-5">
      <div class="mb-4">
        <i class="bi bi-check-circle-fill text-success" style="font-size: 6rem; filter: drop-shadow(0 4px 6px rgba(40,167,69,0.2));"></i>
      </div>
      <h1 class="display-6 fw-bold mb-3">Order Confirmed!</h1>
      <p class="text-muted mb-5 fs-5">Your order has been placed successfully.</p>
      
      <div class="card border-0 bg-light rounded-4 p-4 p-md-5 mx-auto mb-5 text-start shadow-sm" *ngIf="orderResponse">
        <div class="d-flex justify-content-between mb-4 border-bottom border-secondary-subtle pb-4">
          <span class="text-muted fw-bold text-uppercase small">Order Number</span>
          <span class="fw-bold">#{{ orderResponse.orderId || orderResponse.id }}</span>
        </div>
        <div class="d-flex justify-content-between align-items-center">
          <span class="text-muted fw-bold text-uppercase small">Total Processed</span>
          <span class="fw-bold text-dark fs-3">${{ orderResponse.totalPrice | number:'1.2-2' }}</span>
        </div>
      </div>

      <div class="d-flex flex-column gap-3">
        <a routerLink="/orders" class="btn btn-dark rounded-pill py-3 px-5 fw-bold shadow-sm w-100">View My Orders</a>
        <a routerLink="/products" class="btn btn-outline-dark border-2 rounded-pill py-3 px-5 fw-bold w-100">Continue Shopping</a>
      </div>
    </div>
  </div>
</div>
