<div class="container mt-5 py-5">
  <div class="row mb-5 align-items-center">
    <div class="col-md-9">
      <h2 class="fw-bold m-0">Product Catalog</h2>
    </div>
    <div class="col-md-3">
      <div class="search-wrapper rounded-pill border d-flex align-items-center px-3 bg-white">
        <i class="bi bi-search text-muted"></i>
        <input
          type="text"
          class="form-control border-0 shadow-none py-2"
          placeholder="search product...."
        />
      </div>
    </div>
  </div>

  <div class="row">
    <div class="col-lg-3 mb-4">
      <div class="card border-0 shadow-sm p-4 bg-light rounded-4">
        <h5 class="fw-bold mb-4">Categories</h5>
        <ul class="list-unstyled">
          <li class="mb-2">
            <button class="btn w-100 text-start rounded-pill px-3 py-2 border-0 active-category">
              All
            </button>
          </li>

          @for (
            cat of ['Bedroom', 'Salon', 'Kitchen', 'Bathroom', 'Dining room', 'Lighting'];
            track cat
          ) {
            <li class="mb-1">
              <button
                class="btn btn-link w-100 text-start text-dark text-decoration-none px-3 category-link"
              >
                {{ cat }}
              </button>
            </li>
          }
        </ul>

        <div class="form-check mt-4 d-flex align-items-center gap-2">
          <input class="form-check-input" type="checkbox" id="offersOnly" />
          <label class="form-check-label fw-bold" for="offersOnly">Only Offer</label>
        </div>
      </div>
    </div>

    <div class="col-lg-9">
      <div class="row g-4">
        @for (product of products; track product.id) {
          <div class="col-md-6 col-lg-4">
            <div
              class="card h-100 border-0 shadow-sm overflow-hidden rounded-3 bg-light product-card"
            >
              <div class="img-container">
                <img [src]="product.image" class="card-img-top" [alt]="product.name" />
              </div>
              <div class="card-body p-3">
                <div class="d-flex justify-content-between align-items-center mb-2">
                  <h6 class="card-title fw-bold m-0 text-truncate">{{ product.name }}</h6>
                  <span class="rating-badge small fw-bold text-success">
                    <i class="bi bi-star-fill me-1"></i>{{ product.rating }}
                  </span>
                </div>
                <div class="mt-3 d-flex justify-content-between align-items-center">
                  <span class="fw-bold fs-5">${{ product.price }}</span>
                  <button class="btn btn-cart rounded-circle shadow-sm">
                    <i class="bi bi-cart-plus"></i>
                  </button>
                </div>
              </div>
            </div>
          </div>
        } @empty {
          <div class="col-12 text-center py-5">
            <p class="text-muted">No products found.</p>
          </div>
        }
      </div>
    </div>
  </div>
</div>
