<div class="container mt-5 py-4">
  <!-- Loading state -->
  <div *ngIf="isLoading" class="d-flex justify-content-center my-5">
    <div class="spinner-border text-dark" role="status">
      <span class="visually-hidden">Loading...</span>
    </div>
  </div>

  <!-- Not found state -->
  <div *ngIf="notFoundMessage && !isLoading" class="text-center py-5">
    <i class="bi bi-exclamation-circle text-danger display-1 mb-3 d-block"></i>
    <h2 class="fw-bold">{{ notFoundMessage }}</h2>
    <a routerLink="/products" class="btn btn-outline-dark mt-3 px-4 rounded-pill">Back to Products</a>
  </div>

  <!-- Product Details -->
  <ng-container *ngIf="product && !isLoading">
    <div class="row mb-4">
      <div class="col-12">
        <a
          routerLink="/products"
          class="text-decoration-none text-dark d-flex align-items-center gap-2 back-link"
        >
          <i class="bi bi-arrow-left fs-4"></i>
          <span>Back to Catalog</span>
        </a>
      </div>
    </div>

    <div class="row g-5 align-items-center">
    <div class="col-md-6">
      <div class="product-image-wrapper rounded-4 overflow-hidden shadow-sm">
        <img [src]="product.images[0]" class="img-fluid w-100" [alt]="product.name" />
      </div>
      <div class="mt-3 d-flex justify-content-center gap-3">
        <h5 class="text-muted fw-normal" *ngIf="product.workshopName || product.shopName || product.brand">{{ product.workshopName || product.shopName || product.brand }}</h5>
      </div>
    </div>

    <div class="col-md-6">
      <div class="d-flex justify-content-between align-items-start mb-3">
        <h1 class="product-name fw-bold display-6">{{ product.name }}</h1>
        <button class="btn btn-outline-dark rounded-circle p-2 border-0 shadow-sm">
          <i class="bi bi-heart fs-4"></i>
        </button>
      </div>

      <p class="w-75 text-muted fs-5 mb-4 leading-relaxed">
        {{ product.description }}
      </p>

      <h2 class="fw-bold mb-5">${{ product.price }}</h2>

      <div class="d-grid col-lg-8 w-100 d-flex flex-column justify-content-center align-items-center">
        <!-- Error Message -->
        <div *ngIf="errorMessage" class="alert alert-danger w-75 py-2 shadow-sm mb-3" role="alert">
          <i class="bi bi-x-circle-fill me-2"></i> {{ errorMessage }}
        </div>
        
        <!-- Success Message -->
        <div *ngIf="addedSuccess" class="alert alert-success w-75 py-2 shadow-sm mb-3" role="alert">
          <i class="bi bi-check-circle-fill me-2"></i> Added to cart!
        </div>

        <button class="btn btn-add-cart w-75 py-3 rounded-pill text-white fw-bold shadow-sm d-flex justify-content-center align-items-center gap-2" 
                (click)="addToCart()" [disabled]="isAdding || product.stockQuantity <= 0">
          <span *ngIf="isAdding" class="spinner-border spinner-border-sm" role="status" aria-hidden="true"></span>
          {{ isAdding ? 'Adding...' : (product.stockQuantity > 0 ? 'Add To Cart' : 'Out of Stock') }}
        </button>
      </div>
    </div>
  </div>
  </ng-container>
</div>
