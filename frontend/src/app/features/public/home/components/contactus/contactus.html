<section class="contact-section py-5">
  <div class="container">
    <h2 class="text-center mb-5 section-title">{{ 'HOME.CONTACT.TITLE' | translate }}</h2>
    
    <div class="row justify-content-center align-items-center g-5">
      <div class="col-lg-6">
        <div class="contact-form">
          <input type="text" [placeholder]="'FORMS.NAME' | translate" class="form-control custom-input mb-3" />
          <input type="email" [placeholder]="'FORMS.EMAIL' | translate" class="form-control custom-input mb-3" />
          <textarea [placeholder]="'FORMS.MESSAGE' | translate" class="form-control custom-input mb-3" rows="6"></textarea>
        </div>
      </div>

      <div class="col-lg-4">
        <div class="contact-info d-flex flex-column gap-4">
          <div class="info-item d-flex align-items-center gap-3">
            <div class="icon-circle">
              <i class="bi bi-envelope-fill"></i>
            </div>
            <span>hello@damietta.com</span>
          </div>
          <div class="info-item d-flex align-items-center gap-3">
            <div class="icon-circle">
              <i class="bi bi-telephone-fill"></i>
            </div>
            <span>+20 123 456 7890</span>
          </div>
          <div class="info-item d-flex align-items-center gap-3">
            <div class="icon-circle">
              <i class="bi bi-geo-alt-fill"></i>
            </div>
            <span>{{ 'FOOTER.ADDRESS' | translate }}</span>
          </div>
        </div>
      </div>
    </div>

    <div class="text-center mt-5">
      <button class="contact-btn">{{ 'HOME.CONTACT.SEND' | translate }}</button>
    </div>
  </div>
</section>
