<div class="contact my-5">
  <h2 class="mb-5">Contact Us</h2>
  <div class="contact-section d-flex gap-5 justify-content-center">
    <div class="contact-form">
      <input type="text" placeholder="Your Name" class="form-control mb-3" />
      <input type="email" placeholder="Your Email" class="form-control mb-3" />
      <textarea placeholder="Your Message" class="form-control mb-3" rows="5"></textarea>
    </div>
    <div class="contact-info d-flex flex-column justify-content-center gap-3">
      <p><i class="bi bi-envelope"></i> hello@damietta.com</p>
      <p><i class="bi bi-telephone"></i> +20 123 456 7890</p>
      <p><i class="bi bi-geo-alt"></i> Damietta, Egypt</p>
    </div>
  </div>

  <button class="contact-btn mt-3">Send Message</button>
</div>
