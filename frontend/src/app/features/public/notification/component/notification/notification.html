<div class="notification-wrapper position-relative" (click)="$event.stopPropagation()">

  <button class="notification-btn" (click)="toggleDropdown()">
    <i class="bi bi-bell"></i>
    <span class="notification-badge" *ngIf="(unreadCount$ | async)! > 0">
      {{ (unreadCount$ | async)! > 9 ? '9+' : (unreadCount$ | async) }}
    </span>
  </button>

  <div class="notification-dropdown" *ngIf="isOpen">
    <div class="notification-header">
      <span>Notifications</span>
    </div>

    <ng-container *ngIf="(notifications$ | async) as notifications">

      <div
        *ngFor="let n of notifications"
        class="notification-item"
        [class.notification-unread]="!n.isRead"
        [class.notification-read]="n.isRead"
        (click)="onRead(n)">

        <div class="notif-icon">
          <i class="bi bi-hammer"></i>
        </div>

        <div class="notif-content">
          <strong>{{ n.title }}</strong>
          <p>{{ n.message }}</p>
          <small>{{ n.createdAt | date:'short' }}</small>
        </div>

      </div>

      <div *ngIf="notifications.length === 0" class="empty">
        <div class="empty-icon">
          <i class="bi bi-bell-slash"></i>
        </div>
        <p>No notifications yet</p>
      </div>

    </ng-container>
  </div>

</div>
