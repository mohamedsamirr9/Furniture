<div class="notification-wrapper position-relative" (click)="$event.stopPropagation()">
  
  <button class="nav-icon-link position-relative notification-btn" (click)="toggleDropdown()">
    <i class="bi bi-bell fs-5"></i>
    <span class="badge-dot" *ngIf="(unreadCount$ | async)! > 0">
      {{ unreadCount$ | async }}
    </span>
  </button>

  <div class="notification-dropdown" *ngIf="isOpen">
    <div class="notification-header">
      <span>Notifications</span>
    </div>

    <ng-container *ngIf="(notifications$ | async) as notifications">
      <div
        *ngFor="let n of notifications"
        class="notification-item"
        [class.unread]="!n.isRead"
        (click)="onRead(n)">
        <div class="notif-icon">
          <i class="bi bi-hammer"></i>
        </div>
        <div class="notif-content">
          <strong>{{ n.title }}</strong>
          <p>{{ n.message }}</p>
          <small>{{ n.createdAt | date:'short' }}</small>
        </div>
      </div>
      <p *ngIf="notifications.length === 0" class="empty">No notifications</p>
    </ng-container>
  </div>

</div>
