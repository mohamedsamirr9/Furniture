<div class="container-fluid vh-100 login-page">
  <div class="row h-100">

    <!-- LEFT -->
    <div class="col-md-6 d-flex align-items-center left">
      <div class="form-wrapper">

        <h1 class="title">{{ 'AUTH.WELCOME' | translate }}</h1>
        <p class="subtitle">{{ 'AUTH.SIGN_IN_DESC' | translate }}</p>

        <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">

          <label>Email</label>
          <div class="input-group-custom mb-3">
            <i class="bi bi-envelope"></i>
            <input type="email" formControlName="email" placeholder="you@example.com">
          </div>

          <label>Password</label>
          <div class="input-group-custom mb-2">
            <i class="bi bi-lock"></i>
            <input type="password" formControlName="password" placeholder="********">
          </div>

          <div class="text-end mb-4">
            <a href="#" class="link small">Forgot password?</a>
          </div>

          <button class="btn-main w-100">
            {{ 'AUTH.SIGN_IN' | translate }} →
          </button>

          <p class="text-center mt-4">
            Don't have an account?
            <a routerLink="/register" class="link">Sign up</a>
          </p>

        </form>
      </div>
    </div>

    <!-- RIGHT -->
    <div class="col-md-6 d-none d-md-flex align-items-center justify-content-center right">
      <div class="image-card">
        <img src="/assets/images/login.jpg">
        <div class="overlay">
          <span>CURATED COLLECTION</span>
          <h3>{{ 'AUTH.FIND_PERFECT' | translate }}</h3>
          <p>{{ 'AUTH.BROWSE_THOUSANDS' | translate }}</p>
        </div>
      </div>
    </div>

  </div>
</div>
