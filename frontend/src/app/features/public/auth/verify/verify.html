<div class="container-fluid vh-100 verify-page">
  <div class="row h-100">

    <!-- LEFT -->
    <div class="col-md-6 d-flex align-items-center left">
      <div class="form-wrapper">

        <h1 class="title">{{ 'VERIFY.TITLE' | translate }}</h1>
        <p class="subtitle">{{ 'VERIFY.DESC' | translate }}</p>
        <p class="email-text" *ngIf="email">{{ email }}</p>

        <!-- Error -->
        <div *ngIf="errorMessage" class="alert-error mb-3">
          <i class="bi bi-exclamation-circle"></i> {{ errorMessage }}
        </div>

        <!-- Success -->
        <div *ngIf="successMessage" class="alert-success mb-3">
          <i class="bi bi-check-circle"></i> {{ successMessage }}
        </div>

        <!-- OTP -->
        <div class="otp-container mb-4">
          <input
            *ngFor="let digit of otp; let i = index"
            type="text"
            maxlength="1"
            class="otp-input"
            [class.filled]="otp[i]"
            [(ngModel)]="otp[i]"
            (input)="onInput($event, i)"
            (keydown)="onKeyDown($event, i)" />
        </div>

        <button (click)="verify()" [disabled]="isLoading" class="btn-main mb-3">
          <span *ngIf="isLoading" class="spinner"></span>
          <span>{{ isLoading ? ('ALERTS.LOADING' | translate) : ('AUTH_EXTRA.VERIFY_BTN' | translate) }}</span>
        </button>

        <p class="text-center small" style="color: #8a7f77;">
          {{ 'AUTH_EXTRA.RESEND_TEXT' | translate }}
          <a href="javascript:void(0)" (click)="resendOtp()" class="link">{{ 'VERIFY.RESEND' | translate }}</a>
        </p>

      </div>
    </div>

    <!-- RIGHT -->
    <div class="col-md-6 d-none d-md-flex align-items-center justify-content-center right">
      <div class="image-card">
        <img src="/assets/images/login.jpg">
        <div class="overlay">
          <span>VERIFY YOUR EMAIL</span>
          <h3>{{ 'VERIFY.TITLE' | translate }}</h3>
          <p>{{ 'VERIFY.DESC' | translate }}</p>
        </div>
      </div>
    </div>

  </div>
</div>
