<div
  class="container-fluid vh-100 d-flex flex-column align-items-center justify-content-center bg-white"
>
  <div class="position-absolute top-0 start-0 p-4">
    <h3 class="brand mb-4" (click)="goHome()" style="cursor: pointer">{{ 'NAV.BRAND' | translate }}</h3>
  </div>

  <div class="text-center mb-4">
    <h2 class="fw-bold mb-3">{{ 'VERIFY.TITLE' | translate }}</h2>
    <p class="text-secondary">{{ 'VERIFY.DESC' | translate }}</p>
    <p class="text-dark fw-bold" *ngIf="email">{{ email }}</p>
  </div>

  <div *ngIf="errorMessage" class="alert alert-danger shadow-sm py-2 mb-3 w-100" style="max-width: 400px">
    {{ errorMessage }}
  </div>

  <div *ngIf="successMessage" class="alert alert-success shadow-sm py-2 mb-3 w-100" style="max-width: 400px">
    {{ successMessage }}
  </div>

  <div class="otp-container d-flex gap-2 mb-4">
    <input 
      *ngFor="let digit of otp; let i = index"
      type="text" 
      maxlength="1" 
      class="form-control otp-input" 
      [(ngModel)]="otp[i]"
      (input)="onInput($event, i)"
      (keydown)="onKeyDown($event, i)" />
  </div>

  <div class="w-100 d-flex flex-column align-items-center" style="max-width: 400px">
    <button (click)="verify()" [disabled]="isLoading" class="btn btn-verify w-100 py-2 text-white mb-3 shadow-sm d-flex align-items-center justify-content-center gap-2">
      <span *ngIf="isLoading" class="spinner-border spinner-border-sm" role="status"></span>
      {{ isLoading ? ('ALERTS.LOADING' | translate) : ('AUTH_EXTRA.VERIFY_BTN' | translate) }}
    </button>
    <p class="text-secondary small">
      {{ 'AUTH_EXTRA.RESEND_TEXT' | translate }} 
      <a href="javascript:void(0)" (click)="resendOtp()" class="text-decoration-none fw-bold text-dark">{{ 'VERIFY.RESEND' | translate }}</a>
    </p>
  </div>
</div>
