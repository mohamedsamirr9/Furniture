<div class="container-fluid vh-100 register-page">
  <div class="row h-100">

    <!-- LEFT -->
    <div class="col-md-6 d-flex align-items-center left">
      <div class="form-wrapper">

        <h1 class="title">{{ 'AUTH.CREATE_ACCOUNT' | translate }}</h1>
        <p class="subtitle">{{ 'AUTH.JOIN_DESC' | translate }}</p>

        <form [formGroup]="registerForm" (ngSubmit)="onSubmit()">

          <!-- ROW 1 -->
          <div class="row">
            <div class="col-md-6 mb-3">
              <label>{{ 'AUTH.FULL_NAME' | translate }}</label>
              <div class="input-group-custom">
                <i class="bi bi-person"></i>
                <input type="text" formControlName="name" placeholder="ex: Ahmed Ali">
              </div>
            </div>

            <div class="col-md-6 mb-3">
              <label>Username</label>
              <div class="input-group-custom">
                <i class="bi bi-person-badge"></i>
                <input type="text" formControlName="userName" placeholder="ex: ahmed99">
              </div>
            </div>
          </div>

          <!-- EMAIL -->
          <div class="mb-3">
            <label>{{ 'AUTH.EMAIL' | translate }}</label>
            <div class="input-group-custom">
              <i class="bi bi-envelope"></i>
              <input type="email" formControlName="email" placeholder="you@example.com">
            </div>
          </div>

          <!-- ROW 2 -->
          <div class="row">
            <div class="col-md-6 mb-3">
              <label>{{ 'AUTH.PASSWORD' | translate }}</label>
              <div class="input-group-custom">
                <i class="bi bi-lock"></i>
                <input type="password" formControlName="password" placeholder="********">
              </div>
            </div>

            <div class="col-md-6 mb-4">
              <label>Confirm Password</label>
              <div class="input-group-custom">
                <i class="bi bi-lock"></i>
                <input type="password" formControlName="confirmPassword" placeholder="********">
              </div>

              <div *ngIf="registerForm.hasError('passwordMismatch') && registerForm.get('confirmPassword')?.touched"
                   class="text-danger small mt-1">
                Passwords do not match.
              </div>
            </div>
          </div>

          <!-- BUTTON -->
          <button type="submit" class="btn-main w-100">
            {{ 'AUTH.CREATE_ACCOUNT' | translate }} →
          </button>

          <p class="text-center mt-4">
            {{ 'AUTH.ALREADY_ACCOUNT' | translate }}
            <a routerLink="/login" class="link">{{ 'AUTH.SIGN_IN' | translate }}</a>
          </p>

        </form>
      </div>
    </div>

    <!-- RIGHT -->
    <div class="col-md-6 d-none d-md-flex align-items-center justify-content-center right">
      <div class="image-card">
        <img src="assets/images/register.jpg" alt="furniture">
        <div class="overlay">
          <span>JOIN THE COMMUNITY</span>
          <h3>{{ 'AUTH.START_JOURNEY' | translate }}</h3>
          <p>{{ 'AUTH.JOURNEY_DESC' | translate }}</p>
        </div>
      </div>
    </div>

  </div>
</div>
