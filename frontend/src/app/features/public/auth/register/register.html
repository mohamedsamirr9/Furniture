<div class="container-fluid vh-100 register-page">
  <div class="row h-100">
    <!-- LEFT -->
    <div class="col-md-6 d-flex flex-column justify-content-center px-5">
      <h3 class="brand mb-4" (click)="goHome()" style="cursor: pointer">Furnora</h3>

      <h2 class="fw-bold">Create your account</h2>
      <p class="text-muted mb-4">Join Furnora as a buyer or seller</p>

      <form>
        <div class="mb-3">
          <label class="form-label">Full Name</label>
          <input type="text" class="form-control input" placeholder="ex: ahmed ahmed" />
        </div>

        <div class="mb-3">
          <label class="form-label">Email</label>
          <input type="email" class="form-control input" placeholder="you@example.com" />
        </div>

        <div class="mb-4">
          <label class="form-label">Password</label>
          <input type="password" class="form-control input" placeholder="********" />
        </div>

        <button class="btn btn-main w-100 mb-3">Create Account</button>

        <p class="text-center">
          Already have an account?
          <a routerLink="/login" class="link">Sign In</a>
        </p>
      </form>
    </div>

    <!-- RIGHT -->
    <div
      class="col-md-6 d-none d-md-flex flex-column justify-content-center align-items-center right text-center"
    >
      <div class="square mb-4"></div>
      <h3 class="fw-bold">Start Your Journey</h3>
      <p class="text-muted w-75">
        Whether buying or selling, Furnora makes furniture trading simple and elegant.
      </p>
    </div>
  </div>
</div>
