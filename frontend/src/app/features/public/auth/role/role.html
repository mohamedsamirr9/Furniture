<div
  class="container-fluid vh-100 d-flex flex-column align-items-center justify-content-center bg-white"
>
  <div class="role-container bg-white shadow-lg text-center">
    <h3 class="brand mb-4" (click)="goHome()" style="cursor: pointer">{{ 'NAV.BRAND' | translate }}</h3>
    <h2 class="fw-bold fs-2 text-dark">{{ 'AUTH.JOIN_US' | translate }}</h2>
    <p class="text-secondary">{{ 'AUTH.JOIN_DESC' | translate }}</p>
  </div>

  <div class="row g-4 justify-content-center w-100 px-3">
    <div class="col-md-4 col-lg-3">
      <div class="card h-100 border-light-subtle shadow-sm selection-card py-4">
        <div class="card-body text-center d-flex flex-column align-items-center">
          <div class="icon-box bg-success-subtle text-success mb-3">
            <i class="bi bi-bag-check fs-2"></i>
          </div>
          <h3 class="card-title fw-bold">{{ 'AUTH.CUSTOMER' | translate }}</h3>
          <p class="card-text text-muted small mt-2">
            {{ 'AUTH.CUSTOMER_DESC' | translate }}
          </p>
        </div>
      </div>
    </div>

    <div class="col-md-4 col-lg-3">
      <div class="card h-100 border-light-subtle shadow-sm selection-card py-4">
        <div class="card-body text-center d-flex flex-column align-items-center">
          <div class="icon-box bg-primary-subtle text-primary mb-3">
            <i class="bi bi-house-door fs-2"></i>
          </div>
          <h3 class="card-title fw-bold">{{ 'AUTH.SELLER' | translate }}</h3>
          <p class="card-text text-muted small mt-2">
            {{ 'AUTH.SELLER_DESC' | translate }}
          </p>
        </div>

      </div>
    </div>
  </div>
</div>
