<div class="container-fluid vh-100 forgot-page">
  <div class="row h-100">

    <!-- LEFT -->
    <div class="col-md-6 d-flex align-items-center left">
      <div class="form-wrapper">

        <div class="back-link mb-4">
          <a routerLink="/login" class="link">
            <i class="bi bi-arrow-left"></i> Back to Login
          </a>
        </div>

        <h1 class="title">Forgot Password?</h1>
        <p class="subtitle">Enter your email and we'll send you a reset code.</p>

        <form [formGroup]="forgotForm" (ngSubmit)="onSubmit()">

          <label>Email</label>
          <div class="input-group-custom mb-1"
               [class.input-error]="forgotForm.get('email')?.invalid && forgotForm.get('email')?.touched">
            <i class="bi bi-envelope"></i>
            <input type="email" formControlName="email" placeholder="you@example.com">
          </div>
          <div *ngIf="forgotForm.get('email')?.invalid && forgotForm.get('email')?.touched" class="error-text mb-2">
            <span *ngIf="forgotForm.get('email')?.hasError('required')">Email is required.</span>
            <span *ngIf="forgotForm.get('email')?.hasError('email')">Enter a valid email.</span>
          </div>
          <div *ngIf="!(forgotForm.get('email')?.invalid && forgotForm.get('email')?.touched)" class="mb-3"></div>

          <div *ngIf="errorMessage" class="alert-error mb-3">
            <i class="bi bi-exclamation-circle"></i> {{ errorMessage }}
          </div>

          <button type="submit" class="btn-main w-100" [disabled]="isLoading">
            <span *ngIf="isLoading" class="spinner"></span>
            <span *ngIf="!isLoading">Send Reset Code →</span>
          </button>

        </form>
      </div>
    </div>

    <!-- RIGHT -->
    <div class="col-md-6 d-none d-md-flex align-items-center justify-content-center right">
      <div class="image-card">
        <img src="/assets/images/login.jpg">
        <div class="overlay">
          <span>ACCOUNT RECOVERY</span>
          <h3>Reset Your Password</h3>
          <p>We'll help you get back into your account safely.</p>
        </div>
      </div>
    </div>

  </div>
</div>
